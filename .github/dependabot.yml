# Dependabot 自动依赖更新配置
# 文档: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Flutter 客户端依赖
  - package-ecosystem: "pub"
    directory: "/dacong-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "fjz"
    labels:
      - "dependencies"
      - "flutter"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # 仅更新安全漏洞
    versioning-strategy: increase-if-necessary

  # Flutter 管理后台依赖
  - package-ecosystem: "pub"
    directory: "/dacong-admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "fjz"
    labels:
      - "dependencies"
      - "flutter"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase-if-necessary

  # Python 爬虫依赖
  - package-ecosystem: "pip"
    directory: "/dacong-spider"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "fjz"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase-if-necessary

  # Next.js 控制台依赖
  - package-ecosystem: "npm"
    directory: "/dacong-console"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "fjz"
    labels:
      - "dependencies"
      - "npm"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase-if-necessary
    # 忽略主要版本更新（避免破坏性变更）
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ESLint 10 需要新的 flat config 格式，暂不升级
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # TypeScript 6 有 API 变化，暂不升级
      - dependency-name: "typescript"
        versions: [">=6.0.0"]

  # GitHub Actions 工作流依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "fjz"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

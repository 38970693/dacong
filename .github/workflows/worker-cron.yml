name: Worker Cron Jobs

on:
  # 每5分钟运行一次爬虫 + 审核
  schedule:
    - cron: '*/5 * * * *'
  # 支持手动触发
  workflow_dispatch:
  # 也可以在代码推送时触发
  push:
    branches:
      - main
    paths:
      - 'dacong-worker/**'

jobs:
  crawl-and-moderate:
    name: Crawl & Moderate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: dacong-worker

      - name: Run Crawler
        run: npm run crawl
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Moderator
        run: npm run moderate
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  trending:
    name: Update Trending
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: dacong-worker

      - name: Update Trending Cache
        run: npm run trending
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
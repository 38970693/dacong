name: Test Suite

on:
  push:
    branches: [ main, develop ]
    paths:
      # 只在 dacong-console 和 dacong-worker 变更时运行
      - 'dacong-console/**'
      - 'dacong-worker/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dacong-console/**'
      - 'dacong-worker/**'

# 旧的 Flutter/Deno 项目已归档，暂不运行测试
# dacong-client, dacong-admin, dacong-api 需要单独维护

jobs:
  # Console (Next.js) 测试
  test-console:
    name: Console Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-console/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-console

      - name: Run tests
        run: npm test -- --run
        working-directory: dacong-console

  # Worker 测试
  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-worker

      - name: Run tests
        run: npm test -- --run
        working-directory: dacong-worker
name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.dacong.ai
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Staging
        run: |
          chmod +x scripts/deploy_staging.sh
          ./scripts/deploy_staging.sh

      - name: 上传部署日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deployment-log
          path: deployment-staging.log
          retention-days: 7

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://dacong.ai
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Production
        run: |
          chmod +x scripts/deploy_production.sh
          ./scripts/deploy_production.sh

      - name: 上传部署日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-deployment-log
          path: deployment-production.log
          retention-days: 30

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

name: Update AI News

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dacong-spider/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: dacong-spider
      - name: Collect AI sources
        working-directory: dacong-spider
        run: |
          succeeded=0
          for source in hackernews ai_news_rss bluesky arxiv; do
            if python main.py --spider "$source"; then
              succeeded=$((succeeded + 1))
            fi
          done
          test "$succeeded" -gt 0
      - name: Process collected news
        run: |
          python - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              os.environ['SUPABASE_URL'] + '/functions/v1/process-ai-news',
              data=b'{}', method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_ROLE_KEY'],
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)
          print(json.dumps(result))
          if not result.get('success'):
              raise SystemExit('AI news processing failed')
          PY

name: Update AI Rankings

on:
  # 每日 UTC 0:00 (北京时间 08:00) 自动运行
  schedule:
    - cron: '0 0 * * *'

  # 手动触发（方便调试和补跑）
  workflow_dispatch:
    inputs:
      skip_db_write:
        description: '跳过数据库写入 (dry-run)'
        required: false
        default: 'false'
        type: boolean

  # 代码推送时触发（可选，用于开发阶段验证）
  push:
    branches:
      - main
    paths:
      - 'dacong-spider/**'

# 环境变量
env:
  PYTHONUNBUFFERED: '1'

jobs:
  update-rankings:
    name: Fetch & Save Rankings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: dacong-spider/requirements.txt

      - name: Install dependencies
        run: pip install -r dacong-spider/requirements.txt
        working-directory: dacong-spider

      - name: Run Rankings Spider
        run: |
          if [ "${{ inputs.skip_db_write }}" == "true" ]; then
            python run_all_rankings.py --all
          else
            python run_all_rankings.py --all --save-db
          fi
        working-directory: dacong-spider
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

# ============================================================
# GitHub Secrets 配置说明
# ============================================================
# 需要在 GitHub 仓库设置以下 Secrets:
#
# 1. SUPABASE_URL
#    - 获取方式: Supabase Dashboard → Project Settings → API
#    - 值格式: https://xxx.supabase.co
#
# 2. SUPABASE_SERVICE_ROLE_KEY
#    - 获取方式: Supabase Dashboard → Project Settings → API
#    - ⚠️ 注意: 这是服务端密钥，具有管理员权限
#    - ⚠️ 切勿泄漏或提交到代码库
#
# 设置路径: GitHub 仓库 → Settings → Secrets and variables → Actions
# ============================================================

name: Security Scan

on:
  schedule:
    # 每日安全扫描 - 凌晨 2 点
    - cron: '0 2 * * *'
    # 每周全面审计 - 每周一凌晨 3 点
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      audit_level:
        description: '审计级别'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - full

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装扫描工具
        run: |
          pip install pip-audit safety
          npm install -g snyk

      - name: 运行完整安全扫描
        run: |
          chmod +x scripts/run-security-scan.sh
          bash scripts/run-security-scan.sh

      - name: 上传扫描报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_number }}
          path: security-reports/
          retention-days: 90

      - name: 检查 CRITICAL 漏洞
        run: |
          echo "检查是否存在 CRITICAL 级别漏洞..."
          if grep -r "CRITICAL" security-reports/ 2>/dev/null; then
            echo "⚠️ 发现 CRITICAL 级别漏洞，请立即处理！"
            exit 1
          fi

      - name: 发送通知
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 安全扫描发现 CRITICAL 漏洞',
              body: `安全扫描在 ${context.workflow} 中发现 CRITICAL 级别漏洞。\n\n请查看 [扫描报告](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['security', 'critical']
            })

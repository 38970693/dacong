name: Code Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dacong-console/src/**'
      - 'dacong-worker/src/**'
  pull_request:
    paths:
      - 'dacong-console/src/**'
      - 'dacong-worker/src/**'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-console/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-console

      - name: Run ESLint
        run: npm run lint
        working-directory: dacong-console

      - name: Run TypeScript check
        run: npm run type-check
        working-directory: dacong-console

  test-console:
    name: Console Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-console/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-console

      - name: Run tests with coverage
        run: npm run test -- --coverage --run
        working-directory: dacong-console

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: dacong-console/coverage/coverage-final.json
          flags: unittests
          name: dacong-console
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-worker:
    name: Worker Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-worker

      - name: Run tests with coverage
        run: npm run test -- --coverage --run
        working-directory: dacong-worker

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: dacong-worker/coverage/coverage-final.json
          flags: unittests
          name: dacong-worker
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
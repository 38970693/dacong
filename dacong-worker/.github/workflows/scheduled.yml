name: Worker Scheduled Tasks

on:
  schedule:
    # 每小时运行一次爬虫
    - cron: '0 * * * *'
  workflow_dispatch:
    # 手动触发

jobs:
  crawl:
    name: Crawl News
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-worker

      - name: Run Crawler
        run: npm run crawl
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  moderate:
    name: Moderate Content
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-worker

      - name: Run Moderation
        run: npm run moderate
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  trending:
    name: Calculate Trending
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dacong-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dacong-worker

      - name: Calculate Trending
        run: npm run trending
        working-directory: dacong-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
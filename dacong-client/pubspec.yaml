name: dacong_client
description: DaCong - AI工具决策助手，支持 Web / Android / iOS
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Network
  dio: ^5.4.0
  supabase_flutter: ^2.5.0
  connectivity_plus: ^7.1.1

  # Functional Programming
  dartz: ^0.10.1

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Routing
  go_router: ^17.2.1

  # Storage
  shared_preferences: ^2.2.2
  uuid: ^4.5.1

  # Localization
  intl: ^0.20.2

  # Time Formatting
  timeago: ^3.7.0

  # Package Info
  package_info_plus: ^10.1.0

  # Share
  share_plus: ^13.1.0

  # Error Monitoring
  sentry_flutter: ^8.14.2
  flutter_riverpod: ^3.4.2
  riverpod: ^3.4.2
  state_notifier: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  injectable_generator: ^3.0.2

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

version: '3.8'
services:
  spider:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dacong-spider
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SPIDER_GITHUB_ENABLED=true
      - SPIDER_HUGGINGFACE_ENABLED=true
      - SPIDER_HACKERNEWS_ENABLED=true
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('https://github.com/trending')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

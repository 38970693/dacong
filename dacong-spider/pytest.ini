[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 覆盖率配置
addopts =
    --verbose
    --strict-markers
    --cov=core
    --cov=spiders
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试

# 日志
log_cli = true
log_cli_level = INFO

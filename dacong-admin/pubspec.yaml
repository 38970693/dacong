name: dacong_admin
description: DaCong运营后台 - 内容审核、用户管理、数据看板
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.0

  # 路由
  go_router: ^13.0.0

  # Supabase
  supabase_flutter: ^2.0.0

  # UI组件
  flutter_localizations:
    sdk: flutter

  # 工具库
  intl: ^0.20.2
  uuid: ^4.0.0
  csv: ^6.0.0
  path_provider: ^2.1.0

  # 图表
  fl_chart: ^0.65.0

  # 数据表格
  data_table_2: ^2.5.0

  # 错误监控
  sentry_flutter: ^7.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

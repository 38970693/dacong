server {
    listen 80;
    server_name cdn.dacong.ai;

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cdn.dacong.ai;

    # SSL 证书配置
    ssl_certificate /etc/ssl/certs/dacong.ai.crt;
    ssl_certificate_key /etc/ssl/private/dacong.ai.key;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS 配置（如果需要跨域访问）
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

    # 日志配置
    access_log /var/log/nginx/cdn.dacong.ai.access.log;
    error_log /var/log/nginx/cdn.dacong.ai.error.log;

    # 根目录
    root /var/www/cdn;

    # 图片资源
    location /images/ {
        # 长期缓存
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 启用 gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_types image/svg+xml;

        # 如果文件不存在，返回 404
        try_files $uri =404;
    }

    # 静态资源（CSS、JS、字体等）
    location /assets/ {
        # 超长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 启用 gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json font/woff font/woff2;

        # 如果文件不存在，返回 404
        try_files $uri =404;
    }

    # 字体文件
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        try_files $uri =404;
    }

    # 视频文件
    location /videos/ {
        expires 7d;
        add_header Cache-Control "public";

        # 支持范围请求（用于视频流）
        add_header Accept-Ranges bytes;

        try_files $uri =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 默认拒绝其他请求
    location / {
        deny all;
    }
}

# 可选：WebP 图片自动转换（需要 ngx_http_image_filter_module）
# 如果客户端支持 WebP，自动返回 WebP 格式
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

